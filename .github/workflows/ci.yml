name: GomokuVision — Python and Windows gates
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r python/requirements-dev.txt
      - run: python python/tools/restore_demo_videos.py --verify
      - run: PYTHONPATH=python python -m pytest -q python/tests
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: python python/tools/restore_demo_videos.py --verify
      - shell: pwsh
        run: .\scripts\Quick-Engine-Gate-Windows.ps1
