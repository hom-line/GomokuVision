[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "gomoku-vision"
version = "0.2.0"
description = "Gomoku board recognition with NCC templates and a tactical heuristic recommender"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "opencv-python>=4.8,<5"]
[project.scripts]
gomoku-vision = "gomoku.app:main"
[tool.setuptools]
packages = ["gomoku"]
